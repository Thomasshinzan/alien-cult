<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alien Cult</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

    <h1>Alien Cult</h1>
    
    <div id="stage-display" style="text-align: center; color: #ffeb3b; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">
        ステージ1: 町のカルト
    </div>
    
    <div class="header-controls">
        <div id="turn-display">ターン: <span id="current-turn">1</span></div>
        <div class="system-buttons">
            <button id="btn-executives" class="sys-btn" style="background: var(--select-color); border-color: var(--accent-color); color: #fff; font-weight: bold;">幹部</button>
            <button id="btn-hideout" class="sys-btn" style="background: #1b5e20; border-color: #4caf50; color: #fff; font-weight: bold;">アジト</button>
        </div>
    </div>

    <div id="cult-stats">
        <div class="stat-item">
            <div class="stat-value" id="stat-followers">0</div>
            <div class="stat-label">信者</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-funds">0</div>
            <div class="stat-label">資金</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-suspicion">0</div>
            <div class="stat-label">警戒度</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-growth">+2.0%</div>
            <div class="stat-label">成長率/ターン</div>
        </div>
    </div>
    
    <div id="bonus-display"></div>

    <div id="human-list"></div>

    <div id="action-area">
        <div class="mp-container">
            <div class="mp-header">
                <span>精神力</span>
                <span id="mp-text">100 / 100</span>
            </div>
            <div class="mp-bar-bg">
                <div class="mp-bar-fill" id="mp-bar"></div>
            </div>
        </div>
        <div class="button-group">
            <button id="btn-brainwash" disabled>洗脳する</button>
            <button id="btn-end-turn">ターン終了</button>
        </div>
    </div>

    <div id="game-over-screen">
        <h2>GAME OVER</h2>
        <p>エイリアンの存在が社会に露見した。</p>
        <button id="btn-restart" onclick="location.reload()">再挑戦</button>
    </div>

    <!-- 幹部リストモーダル -->
    <div id="executives-modal" class="modal-overlay">
        <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h3 style="color: var(--accent-color); margin-top: 0;">幹部リスト</h3>
            <div id="executives-list" style="overflow-y: auto; flex: 1; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
            <button id="btn-close-executives" class="sys-btn" style="width: 100%; padding: 12px; font-size: 1rem;">閉じる</button>
        </div>
    </div>

    <!-- アジトモーダル -->
    <div id="hideout-modal" class="modal-overlay">
        <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column; text-align: left; padding: 15px;">
            <h3 style="color: #4caf50; margin-top: 0; text-align: center; flex-shrink: 0;">教団アジト</h3>
            
            <div style="background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; flex-shrink: 0;">
                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 4px;">現在の拠点</div>
                <div id="hideout-name" style="font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 6px;">廃屋</div>
                <div id="hideout-desc" style="font-size: 0.85rem; color: #ccc; line-height: 1.4;">説明文...</div>
            </div>

            <div style="background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; flex-shrink: 0;">
                <div style="font-size: 0.9rem; font-weight: bold; color: #fff; margin-bottom: 8px;">拠点・設備拡張</div>
                <button id="btn-expand-hideout" class="sys-btn" style="width: 100%; padding: 10px; font-size: 0.95rem; background: #0066cc; color: #fff; border: none; font-weight: bold;">スロット拡張 (コスト: 500)</button>
            </div>

            <!-- ここだけがスクロールする -->
            <div style="background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; flex: 1; min-height: 0; overflow-y: auto;">
                <div style="font-size: 0.9rem; font-weight: bold; color: #fff; margin-bottom: 10px;">コレクション・設備</div>
                <div id="hideout-collections" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>

            <!-- 枠の外に出して常に下部に固定 -->
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-shrink: 0;">
                <button id="btn-reset" class="sys-btn" style="padding: 8px 12px; font-size: 0.75rem; background: transparent; color: #777; border: 1px solid #444;">データリセット</button>
                <button id="btn-close-hideout" class="sys-btn" style="flex: 1; padding: 12px; font-size: 1rem; background: #333; color: #fff; font-weight: bold;">閉じる</button>
            </div>
        </div>
    </div>

    <!-- カスタムダイアログ -->
    <div id="custom-modal" class="modal-overlay" style="z-index: 2000;">
        <div class="modal-content">
            <h3 id="modal-title">タイトル</h3>
            <p id="modal-message">メッセージ内容</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="modal-btn-cancel" style="display: none; background: #444; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1;">キャンセル</button>
                <button id="modal-btn-ok" style="background: var(--accent-color); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1;">確認</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js?v=4"></script>
</body>
</html>
